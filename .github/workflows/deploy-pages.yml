name: Build and deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run web:build

      - name: Add custom domain file
        run: echo "spurth.com" > web-build/CNAME

      - name: Add legal pages
        run: |
          mkdir -p web-build/terms web-build/privacy
          cp web/terms.html web-build/terms/index.html
          cp web/privacy.html web-build/privacy/index.html

      - name: Add favicon
        # logo.png isn't square, and browsers render favicons in a square
        # slot — a plain copy gets visibly stretched in the tab. Pad it onto
        # a transparent square canvas (sized to the image's larger
        # dimension) instead of distorting it.
        run: convert src/assets/logo.png -background none -gravity center -extent "%[fx:max(w,h)]x%[fx:max(w,h)]" web-build/favicon.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
