name: Build and deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run web:build

      - name: Add custom domain file
        run: echo "spurth.com" > web-build/CNAME

      - name: Add legal pages
        run: |
          mkdir -p web-build/terms web-build/privacy
          cp web/terms.html web-build/terms/index.html
          cp web/privacy.html web-build/privacy/index.html

      - name: Add favicon
        # logo.png isn't square, and browsers render favicons in a square
        # slot — a plain copy gets visibly stretched in the tab. Pad it onto
        # a transparent square canvas (sized to the image's larger
        # dimension) instead of distorting it. Uses sharp (via Node, already
        # set up above) rather than relying on ImageMagick being present on
        # the runner.
        run: |
          npm install --no-save sharp
          node -e "
            const sharp = require('sharp');
            (async () => {
              const meta = await sharp('src/assets/logo.png').metadata();
              const size = Math.max(meta.width, meta.height);
              await sharp('src/assets/logo.png')
                .resize(size, size, { fit: 'contain', background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .toFile('web-build/favicon.png');
            })();
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
